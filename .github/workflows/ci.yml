name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check types and formatting
        run: npm run check && npm run lint && npm run format:check
      - name: Verify committed bundle
        run: npm run check:dist
      - name: Test
        run: npm run test:coverage
      - name: Run Marketplace action against an actual caller
        id: impact
        uses: ./
        with:
          before-file: tests/fixtures/before.yml
          after-file: tests/fixtures/after.yml
          provider: example/automation/.github/workflows/build.yml
          callers-root: tests/fixtures/callers
          report-file: ${{ runner.temp }}/impact.json
          fail-on-impact: 'false'
      - name: Check the public output
        env:
          AFFECTED: ${{ steps.impact.outputs.affected-count }}
          MATCHED: ${{ steps.impact.outputs.matched-count }}
        run: |
          test "$AFFECTED" = 1
          test "$MATCHED" = 1
