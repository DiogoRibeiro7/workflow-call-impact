name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Run Marketplace action against an actual caller
        id: impact
        uses: ./
        with:
          before-file: tests/fixtures/before.yml
          after-file: tests/fixtures/after.yml
          provider: example/automation/.github/workflows/build.yml
          callers-root: tests/fixtures/callers
          report-file: ${{ runner.temp }}/impact.json
          fail-on-impact: 'false'
      - name: Check the public output
        env:
          AFFECTED: ${{ steps.impact.outputs.affected-count }}
          MATCHED: ${{ steps.impact.outputs.matched-count }}
        run: |
          test "$AFFECTED" = 1
          test "$MATCHED" = 1
