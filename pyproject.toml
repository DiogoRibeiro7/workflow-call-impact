[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-call-impact"
version = "0.1.0"
description = "Find affected consumers of reusable GitHub workflow changes"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.15,<3", "types-PyYAML>=6.0,<7"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
